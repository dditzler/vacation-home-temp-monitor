# ARCHIVED — PlatformIO environment for ESP32 WROOM-32 (generic esp32dev)
# To build: copy this section into the main platformio.ini
# Sensor pin defaults to GPIO 4 (SENSOR_PIN not overridden in build flags)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
