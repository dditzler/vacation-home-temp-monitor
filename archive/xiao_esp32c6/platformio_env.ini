# ARCHIVED — PlatformIO environment for Seeed XIAO ESP32-C6
# To build: copy this section into the main platformio.ini
# Boards dir required: sensor_test/boards/xiao_esp32c6.json

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSENSOR_PIN=2

lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
