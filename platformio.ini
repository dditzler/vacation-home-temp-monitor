[platformio]
boards_dir   = boards
default_envs = tsim7000g

; ============================================================
;  TEST BUILD — T-SIM7000G  (no sensor required)
;  Injects stub values so the full modem/GPS/MQTT stack can be
;  validated before the BME280 is wired.
;  Publishes every 10 s so results appear quickly on the monitor.
;  Switch default_envs back to tsim7000g once sensor is attached.
; ============================================================
[env:tsim7000g_test]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port        = /dev/cu.usbserial-59680320951
monitor_port       = /dev/cu.usbserial-59680320951
upload_speed       = 115200
upload_resetmethod = nodemcu
build_flags =
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSTUB_TEMP=72.5            ; stub °F injected in place of real sensor
    -DPUBLISH_INTERVAL=10000UL  ; 10 s publishes — faster feedback during testing
    -DFORCE_CELLULAR            ; skip WiFi entirely, go straight to Hologram

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    vshymanskyy/TinyGSM @ ^0.11.7
    vshymanskyy/StreamDebugger @ ^1.0.1

; ============================================================
;  PRODUCTION BUILD — T-SIM7000G
;  WiFi-first with Hologram cellular fallback
;  BMP280 on I2C (SDA=GPIO21, SCL=GPIO22), address 0x76
; ============================================================
[env:tsim7000g]
platform           = espressif32
board              = esp32dev          ; T-SIM7000G uses ESP32 WROVER core
framework          = arduino
monitor_speed      = 115200
upload_port        = /dev/cu.usbserial-59680320951
monitor_port       = /dev/cu.usbserial-59680320951
upload_speed       = 115200
upload_resetmethod = nodemcu

; OTA requires two flash partitions — min_spiffs reserves ~1.8 MB per OTA slot.
; If the sketch grows beyond ~1.8 MB, switch to a custom partition table.
board_build.partitions = min_spiffs.csv

build_flags =
    ; Increase stack for TinyGSM + SSL overhead
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    vshymanskyy/TinyGSM @ ^0.11.7
    vshymanskyy/StreamDebugger @ ^1.0.1   ; optional — remove to save flash
    arduino-libraries/ArduinoHttpClient @ ^0.6.1   ; OTA downloads

; ============================================================
;  ARCHIVED BOARDS  (kept for reference; not built by default)
;  To build: pio run -e xiao_esp32c6   OR   pio run -e esp32dev
;  Source code for these is in: src/archive/<board>/main.cpp
; ============================================================

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSENSOR_PIN=2

lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8

[env:esp32dev]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200

lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
