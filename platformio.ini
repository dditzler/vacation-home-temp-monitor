[platformio]
boards_dir   = boards
default_envs = tsim7000g

; ============================================================
;  TEST BUILD — T-SIM7000G  (SIM7-0001, no sensor required)
;  Injects stub values so modem/NITZ/MQTT/power-outage stack can be
;  validated before a real sensor is wired.
;  Publishes every 10 s for faster monitor feedback.
; ============================================================
[env:tsim7000g_test]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port        = /dev/cu.usbserial-59680320951
monitor_port       = /dev/cu.usbserial-59680320951
upload_speed       = 115200
upload_resetmethod = nodemcu
build_flags =
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSENSOR_BMP280                         ; satisfies #error guard; real reads skipped by STUB_TEMP
    -DSTUB_TEMP=72.5                        ; stub °F injected in place of real sensor
    -DPUBLISH_INTERVAL=10000UL              ; 10 s publishes — faster feedback during testing
    -DFORCE_CELLULAR                        ; skip WiFi entirely, go straight to Hologram

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    vshymanskyy/TinyGSM @ ^0.11.7
    vshymanskyy/StreamDebugger @ ^1.0.1

; ============================================================
;  PRODUCTION BUILD — T-SIM7000G  (SIM7-0001, Ernie bench unit)
;  Hardware: BMP280 @ 0x76 (I2C), voltage divider GPIO34
;  Cellular-only via Hologram. NITZ time sync.
; ============================================================
[env:tsim7000g]
platform           = espressif32
board              = esp32dev
framework          = arduino
monitor_speed      = 115200
upload_port        = /dev/cu.usbserial-59680320951
monitor_port       = /dev/cu.usbserial-59680320951
upload_speed       = 115200
upload_resetmethod = nodemcu

; OTA requires two flash partitions — min_spiffs reserves ~1.8 MB per OTA slot.
board_build.partitions = min_spiffs.csv

build_flags =
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSENSOR_BMP280
    -DFORCE_CELLULAR
    -DOTA_GITHUB_USER=\"dditzler\"
    -DOTA_GITHUB_REPO=\"ernie\"
    -DOTA_VERSION_PATH=\"/dditzler/ernie/main/sensor-version.json\"
    -DOTA_CHECK_INTERVAL_S=3600

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    vshymanskyy/TinyGSM @ ^0.11.7
    vshymanskyy/StreamDebugger @ ^1.0.1
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
    https://github.com/govorox/SSLClient.git

; ============================================================
;  FUTURE — T-SIM7080G-S3  (V1 production hub)
;  Hardware: SHT31-D @ 0x44 (ADDR→GND), voltage divider GPIO34
;  Cellular-only via Hologram. Cat-M1/NB-IoT.
;  Uncomment and set upload_port when hardware is ready.
; ============================================================
[env:tsim7080g]
platform           = espressif32
board              = esp32dev          ; update to S3 board def when confirmed
framework          = arduino
monitor_speed      = 115200
; upload_port      = /dev/cu.usbserial-XXXXXXXX   ; set when hardware arrives
; monitor_port     = /dev/cu.usbserial-XXXXXXXX

board_build.partitions = min_spiffs.csv

build_flags =
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DSENSOR_SHT31
    -DFORCE_CELLULAR
    -DOTA_GITHUB_USER=\"dditzler\"
    -DOTA_GITHUB_REPO=\"ernie\"
    -DOTA_VERSION_PATH=\"/dditzler/ernie/main/hub-version.json\"
    -DOTA_CHECK_INTERVAL_S=3600

lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    vshymanskyy/TinyGSM @ ^0.11.7
    vshymanskyy/StreamDebugger @ ^1.0.1
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
    https://github.com/govorox/SSLClient.git

; ============================================================
;  ARCHIVED BOARDS  (kept for reference; not built by default)
;  To build: pio run -e xiao_esp32c6   OR   pio run -e esp32dev
;  Source code for these is in: src/archive/<board>/main.cpp
; ============================================================

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSENSOR_PIN=2

lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8

[env:esp32dev]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200

lib_deps =
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
